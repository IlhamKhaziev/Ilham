<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Молодёжный IT-форум 2027 — Казахстан</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root {
  --bg: #070F21;
  --bg2: #0E1E3D;
  --tx: #F1F5F9;
  --mu: #94A3B8;
  --c: #22D3EE;
  --b: #3B82F6;
  --card: rgba(15, 29, 58, 0.65);
  --bd: rgba(255, 255, 255, 0.12);
  --card-hl: linear-gradient(135deg, rgba(59,130,246,0.2), rgba(34,211,238,0.25));
  color-scheme: dark;
  box-sizing: border-box;
}

@media (prefers-color-scheme: light) {
  :root {
    --bg: #F8FAFC;
    --bg2: #E2E8F0;
    --tx: #0F172A;
    --mu: #475569;
    --c: #0891B2;
    --b: #2563EB;
    --card: #FFFFFF;
    --bd: rgba(15, 23, 42, 0.1);
    --card-hl: linear-gradient(135deg, rgba(37,99,235,0.1), rgba(8,145,178,0.15));
    color-scheme: light;
  }
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; width: 100%; overflow: hidden; }
body {
  font-family: 'Plus Jakarta Sans', 'Segoe UI', Arial, sans-serif;
  background-color: var(--bg);
  color: var(--tx);
  font-size: clamp(14px, 1.4vw, 18px);
  user-select: none;
  -webkit-user-select: none;
}

/* Background animated glow blobs */
.blob {
  position: fixed;
  border-radius: 50%;
  filter: blur(80px);
  opacity: 0.35;
  animation: float 16s ease-in-out infinite alternate;
  pointer-events: none;
  z-index: 0;
}
.b1 { width: 45vmax; height: 45vmax; background: var(--b); top: -15vmax; right: -10vmax; }
.b2 { width: 35vmax; height: 35vmax; background: var(--c); bottom: -12vmax; left: -8vmax; animation-delay: -8s; opacity: 0.25; }

@keyframes float {
  0% { transform: translate(0, 0) scale(1); }
  100% { transform: translate(3vmax, 4vmax) scale(1.12); }
}

/* Slide Container */
#deck { position: absolute; inset: 0; z-index: 1; }

.s {
  position: absolute;
  inset: 0;
  padding: 6vh 8vw 12vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 1.8vh;
  opacity: 0;
  visibility: hidden;
  transition: opacity 0.5s ease, visibility 0.5s ease;
  overflow-y: auto;
  max-width: 1400px;
  margin: 0 auto;
}

.s.on { opacity: 1; visibility: visible; }

/* Entrance Animations */
.a {
  opacity: 0;
  transform: translateY(24px);
}
.on .a {
  opacity: 1;
  transform: translateY(0);
  transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1) calc(var(--i, 0) * 0.08s + 0.1s),
              transform 0.6s cubic-bezier(0.16, 1, 0.3, 1) calc(var(--i, 0) * 0.08s + 0.1s);
}

.k {
  color: var(--c);
  font-weight: 700;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  font-size: 0.82em;
  display: flex;
  align-items: center;
  gap: 8px;
}
.k::before {
  content: '';
  display: inline-block;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background-color: var(--c);
}

h1 { font-size: clamp(34px, 6.2vw, 76px); line-height: 1.06; font-weight: 800; letter-spacing: -0.02em; }
h2 { font-size: clamp(24px, 3.5vw, 44px); line-height: 1.12; font-weight: 700; letter-spacing: -0.01em; margin-bottom: 0.8vh; }
h3 { font-size: 1.15em; font-weight: 700; margin-bottom: 0.3em; color: var(--tx); }
p, li { color: var(--mu); line-height: 1.45; }

.big { font-size: clamp(17px, 2vw, 24px); color: var(--c); font-weight: 600; }
.g {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 230px), 1fr));
  gap: clamp(12px, 1.5vw, 20px);
  margin-top: 1vh;
}

/* Cards & Components */
.c {
  background: var(--card);
  border: 1px solid var(--bd);
  border-radius: 16px;
  padding: clamp(16px, 1.8vw, 24px);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  box-shadow: 0 10px 30px rgba(0,0,0,0.1);
  display: flex;
  flex-direction: column;
  justify-content: flex-start;
  transition: transform 0.3s ease, border-color 0.3s ease;
}
.c:hover { border-color: rgba(34, 211, 238, 0.4); transform: translateY(-3px); }
.c.hl { background: var(--card-hl); border: 1px solid var(--c); }

.num {
  font-size: clamp(32px, 4.5vw, 56px);
  font-weight: 800;
  color: var(--c);
  line-height: 1;
  margin-bottom: 6px;
}

.av-box { display: flex; align-items: center; gap: 14px; margin-bottom: 12px; }
.av {
  width: 52px;
  height: 52px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-weight: 800;
  font-size: 1.1em;
  color: #070F21;
  background: linear-gradient(135deg, var(--c), var(--b));
  flex-shrink: 0;
  box-shadow: 0 4px 12px rgba(34, 211, 238, 0.3);
}

.tag {
  display: inline-block;
  font-size: 0.72em;
  font-weight: 700;
  padding: 0.25em 0.75em;
  border-radius: 99px;
  background: rgba(34, 211, 238, 0.15);
  color: var(--c);
  border: 1px solid rgba(34, 211, 238, 0.3);
  margin-bottom: 0.6em;
  align-self: flex-start;
}
.tag.alt { background: rgba(59, 130, 246, 0.15); color: var(--b); border-color: rgba(59, 130, 246, 0.3); }

.note { font-size: 0.82em; color: var(--mu); opacity: 0.8; margin-top: 4px; }

.row {
  display: grid;
  grid-template-columns: 8em 1fr;
  gap: 12px;
  align-items: center;
  padding: 0.6em 1em;
  margin-bottom: 0.4em;
}
.row b { color: var(--c); font-weight: 700; }
.row span { color: var(--tx); }

.bar {
  display: grid;
  grid-template-columns: minmax(7em, 12em) 1fr 6.5em;
  gap: 12px;
  align-items: center;
  margin: 0.5em 0;
}
.bar div { height: 12px; border-radius: 99px; background: rgba(255,255,255,0.08); overflow: hidden; }
.bar i {
  display: block;
  height: 100%;
  width: 0;
  border-radius: 99px;
  background: linear-gradient(90deg, var(--b), var(--c));
  transition: width 1.2s cubic-bezier(0.16, 1, 0.3, 1) 0.3s;
}
.on .bar i { width: var(--w); }
.bar em { font-style: normal; text-align: right; font-weight: 700; color: var(--tx); font-size: 0.9em; }

.price { font-size: 1.7em; font-weight: 800; color: var(--c); margin: 6px 0 10px 0; }
.c ul { padding-left: 1.2em; font-size: 0.88em; }
.c ul li { margin-bottom: 6px; }

/* Bottom Nav Bar */
.nav {
  position: fixed;
  left: 0; right: 0;
  bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 16px;
  z-index: 10;
}
.nav button {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  border: 1px solid var(--bd);
  background: var(--card);
  color: var(--tx);
  font-size: 18px;
  cursor: pointer;
  backdrop-filter: blur(12px);
  transition: all 0.2s ease;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 15px rgba(0,0,0,0.2);
}
.nav button:hover { background: var(--c); color: #070F21; border-color: var(--c); transform: scale(1.05); }
.nav button:active { transform: scale(0.95); }

#cnt {
  min-width: 4.5em;
  text-align: center;
  color: var(--tx);
  font-weight: 700;
  font-size: 0.9em;
  background: var(--card);
  padding: 8px 16px;
  border-radius: 99px;
  border: 1px solid var(--bd);
  backdrop-filter: blur(12px);
}

#pg {
  position: fixed;
  top: env(safe-area-inset-top, 0px);
  left: 0;
  height: 4px;
  background: linear-gradient(90deg, var(--b), var(--c));
  transition: width 0.4s ease;
  z-index: 10;
}

@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
  .a { opacity: 1; transform: none; }
}

@media (max-width: 768px) {
  .s { padding: 4vh 5vw 12vh; }
  .bar { grid-template-columns: 1fr 5.5em; }
  .bar div { grid-column: 1 / 3; grid-row: 2; }
  .row { grid-template-columns: 1fr; gap: 4px; }
  .num { font-size: clamp(28px, 8vw, 42px); }
  h1 { font-size: clamp(28px, 8vw, 46px); }
  h2 { font-size: clamp(22px, 6vw, 32px); }
}
</style>
</head>
<body>

<div class="blob b1"></div>
<div class="blob b2"></div>
<div id="pg"></div>
<div id="deck"></div>

<div class="nav">
  <button id="pv" aria-label="Назад"><i class="fa-solid fa-chevron-left"></i></button>
  <span id="cnt">1 / 14</span>
  <button id="nx" aria-label="Вперёд"><i class="fa-solid fa-chevron-right"></i></button>
</div>

<script>
const hd = (k, t) => `<div class="k a">${k}</div><h2 class="a" style="--i:1">${t}</h2>`;
const cd = (t, d, i, x='') => `<div class="c a ${x}" style="--i:${i}"><h3>${t}</h3><p>${d}</p></div>`;
const gr = (a, x='') => `<div class="g">${a.map((v, i) => cd(v[0], v[1], i + 2, x)).join('')}</div>`;
const nm = (n, s, l, i) => `<div class="c a" style="--i:${i}"><div class="num"><span data-n="${n}">0</span>${s}</div><p>${l}</p></div>`;
const sp = (ini, n, r, t, tag, i, isAlt=false) => `
<div class="c a" style="--i:${i}">
  <div class="av-box">
    <div class="av">${ini}</div>
    <div>
      <span class="tag ${isAlt ? 'alt' : ''}">${tag}</span>
      <h3 style="margin:0">${n}</h3>
    </div>
  </div>
  <p style="font-weight:600; color:var(--tx); font-size:0.95em;">${r}</p>
  <p style="margin-top:0.4em; font-size:0.9em;">${t}</p>
</div>`;

const tl = a => a.map((v, i) => `<div class="c row a" style="--i:${i+2}"><b>${v[0]}</b><span>${v[1]}</span></div>`).join('');
const bar = (l, w, v, i) => `<div class="bar a" style="--i:${i}"><span>${l}</span><div><i style="--w:${w}%"></i></div><em>${v}</em></div>`;
const pk = (n, pr, l, i, x='') => `<div class="c a ${x}" style="--i:${i}"><h3>${n}</h3><div class="price">${pr}</div><ul>${l.map(y => `<li>${y}</li>`).join('')}</ul></div>`;

const S = [
  // Slide 1: Title
  `<div class="k a">Проект конференции · Казахстан 2027</div>
   <h1 class="a" style="--i:1">Молодёжный<br>IT-форум</h1>
   <div class="big a" style="--i:2">«Технологии будущего: идеи, люди, решения»</div>
   <p class="a" style="--i:3">Масштабное образовательное мероприятие для школьников, студентов, молодых специалистов, преподавателей и IT-компаний</p>
   <p class="a" style="--i:4; margin-top:2vh; font-weight:700; color:var(--c)">Хазиев Ильхам PO 243</p>`,

  // Slide 2: Factsheet
  hd('Factsheet', 'Форум в цифрах') +
  `<div class="g">
    ${nm(500, '+', 'участников офлайн', 2)}
    ${nm(1, ' день', '9:00–15:30 (8 спикеров, 4 мастер-класса)', 3)}
    ${nm(10, '+', 'партнёров и спонсоров', 4)}
    ${nm(0, ' ₸', 'вход по регистрации бесплатный', 5)}

    ${cd('Дата проведения', 'Весна 2027 года, суббота', 6)}
    ${cd('Площадка', 'Конференц-зал Astana Hub / КазНУ / Университет Туран', 7)}
    ${cd('Формат участия', 'Офлайн на площадке + онлайн-трансляция для регионов', 8)}
  </div>
  <p class="note a" style="--i:9">* Рабочие параметры для согласований с оргкомитетом и партнерами.</p>`,

  // Slide 3: Concept & Audience
  hd('Концепция и аудитория', 'Объединяем молодёжь и IT-экосистему') +
  gr([
    ['01. Образование', 'Познакомить участников с трендами цифровизации и востребованными навыками.'],
    ['02. Общение', 'Прямые ответы на вопросы от экспертов, знакомства и нетворкинг.'],

  // Slide 4: Headliner Speakers

  `<div class="g">

    ${sp('АН', 'Алия Нурпеисова', 'Head of AI, «Astana Hub Innovation»', '«Нейросети и профессии будущего: как подготовиться»', 'Хэдлайнер', 3)}
    ${sp('НК', 'Нурасыл Касымов', 'Эксперт по кибербезопасности, «SecKazakhstan»', '«Практический симулятор: как стать этичным хакером»', 'Хэдлайнер', 4)}

  // Slide 5: Speakers (Paid & Barter)

  `<div class="g">
    ${sp('АИ', 'Арман Искаков', 'Директор по найму, «Almaty Tech Lab»', '«Карьерный трек: как попасть на стажировку в IT»', 'Оплата · 750 000 ₸', 2, true)}

    ['Кибербезопасность', 'Защита пользовательских данных и разбор типовых сценариев атак.'],
    ['No-code платформы', 'Быстрое создание прототипа приложения без написания кода.'],
    ['Ярмарка вакансий', 'Стенды компаний, экспресс-собеседования и приём резюме на месте.'],

    ['02. Транспорт', 'Удобная логистика, парковка и организация трансфера для спикеров.'],

    ${bar('Питание', 20, '1 500 000 ₸', 3)}

const d = document.getElementById('deck');
d.innerHTML = S.map(h => `<section class="s">${h}</section>`).join('');
const E = [...d.children];
let cur = -1;

function go(n) {
  n = Math.max(0, Math.min(E.length - 1, n));
  if (n === cur) return;

  E.forEach((e, i) => e.classList.toggle('on', i === n));
  cur = n;

  document.getElementById('cnt').textContent = (n + 1) + ' / ' + E.length;
  document.getElementById('pg').style.width = ((n + 1) / E.length * 100) + '%';
  E[n].scrollTop = 0;

  // Animate numbers inside the current slide
  E[n].querySelectorAll('[data-n]').forEach(el => {
    const target = +el.dataset.n;
    const startTime = performance.now();
    (function animateNumber(now) {
      const progress = Math.min(1, (now - startTime - 200) / 1200);
      const easedProgress = progress < 0 ? 0 : 1 - Math.pow(1 - progress, 3);
      el.textContent = Math.round(target * easedProgress).toLocaleString('ru-RU');
      if (progress < 1) requestAnimationFrame(animateNumber);
    })(startTime);
  });
}

// Navigation Controls
document.getElementById('pv').onclick = () => go(cur - 1);
document.getElementById('nx').onclick = () => go(cur + 1);

// Keyboard Navigation
addEventListener('keydown', e => {
  if (['ArrowRight', 'PageDown', ' '].includes(e.key)) {
    e.preventDefault();
    go(cur + 1);
  }
  if (['ArrowLeft', 'PageUp'].includes(e.key)) {
    e.preventDefault();
    go(cur - 1);
  }
});

// Touch Swipe Navigation
let touchStartX = null;
let touchStartY = null;

addEventListener('touchstart', e => {
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
}, { passive: true });

addEventListener('touchend', e => {
  if (touchStartX === null || touchStartY === null) return;
  const dx = e.changedTouches[0].clientX - touchStartX;
  const dy = e.changedTouches[0].clientY - touchStartY;
  
  // Horizontal swipe primary
  if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 50) {
    go(cur + (dx < 0 ? 1 : -1));
  }
  touchStartX = null;
  touchStartY = null;
});

// Initialize First Slide
go(0);
</script>
